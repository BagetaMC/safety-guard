<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety Guard — Discord Security</title>
<style>
:root{--bg:#090910;--panel:#11111c;--panel2:#171725;--line:#29263d;--purple:#8b5cf6;--violet:#b45cff;--text:#f7f5ff;--muted:#a7a2bd;--green:#55e6b1}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(ellipse at 75% 10%,#41177a33,transparent 34%),radial-gradient(ellipse at 12% 50%,#4b23801c,transparent 35%),linear-gradient(130deg,#090910,#0c0a14 55%,#080810)}
a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 44px));margin:auto}
header{height:78px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff0d;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px;letter-spacing:-.5px}.brand span{color:#b36cff}
.logo{width:42px;height:42px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 13px #8b5cf677)}
nav{display:flex;gap:30px;color:#c5bfd9;font-size:13px;font-weight:600}nav a:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 19px;border-radius:12px;background:linear-gradient(115deg,#7c3aed,#a855f7);border:1px solid #bd8cff66;color:white;font-weight:750;font-size:13px;box-shadow:0 8px 28px #7c3aed28;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 35px #8b5cf655}.btn.ghost{background:#ffffff08;border:1px solid #ffffff22;box-shadow:none}
.hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:36px;padding:76px 0 70px;min-height:510px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #8b5cf644;border-radius:99px;background:#8b5cf610;color:#c7a9ff;font-size:11px;font-weight:700;letter-spacing:.4px}
.pip{width:7px;height:7px;background:#b56cff;border-radius:50%;box-shadow:0 0 12px #b56cff}
h1{font-size:clamp(39px,5.1vw,66px);line-height:1.03;letter-spacing:-2.8px;margin:22px 0 19px;max-width:660px}
.gradient{background:linear-gradient(100deg,#c9a7ff,#8b5cf6 55%,#e3c7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:510px;color:#b2adc4;line-height:1.75;font-size:15px;margin:0 0 27px}
.actions{display:flex;gap:12px;flex-wrap:wrap}.hero-note{font-size:11px;color:#77718d;margin-top:19px}
.art{position:relative;min-height:365px;display:grid;place-items:center;isolation:isolate}
.art:before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#7c3aed27,transparent 68%);filter:blur(8px);z-index:-1}
.orbit{position:absolute;width:88%;height:42%;border:1px solid #985cff55;border-radius:50%;transform:rotate(-22deg);box-shadow:0 0 28px #7c3aed18}
.orbit.two{width:100%;height:53%;transform:rotate(27deg);border-color:#673ab755}
.shield-wrap{position:relative;width:min(280px,70%);aspect-ratio:1;display:grid;place-items:center}
.shield{width:100%;height:100%;filter:drop-shadow(0 15px 38px #7c3aed55)} .bot-art{width:145%;max-width:none;aspect-ratio:1.16;object-fit:contain;border-radius:18px;filter:drop-shadow(0 12px 35px #7c3aed44)}
.float{position:absolute;display:flex;align-items:center;gap:9px;padding:11px 14px;background:#151321e8;border:1px solid #6e4ca866;border-radius:13px;box-shadow:0 12px 35px #0007;backdrop-filter:blur(12px);font-size:12px;font-weight:700}
.float small{display:block;color:#8f89a6;font-size:10px;font-weight:500;margin-top:3px}.float svg{width:22px;color:#b78aff}.f1{top:18%;left:0}.f2{right:-2%;bottom:18%}
.section{padding:50px 0 68px;border-top:1px solid #ffffff0b}
.section-head{text-align:center;margin:0 auto 30px}.section-head .eyebrow{margin-bottom:13px}h2{font-size:clamp(25px,3vw,36px);letter-spacing:-1px;margin:0 0 10px}.sub{font-size:13px;color:var(--muted);line-height:1.7}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.feature{position:relative;padding:22px 21px 23px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#171522,#101019);overflow:hidden;transition:.2s}
.feature:after{content:"";position:absolute;width:130px;height:130px;right:-70px;top:-80px;background:#8b5cf618;filter:blur(30px);border-radius:50%}
.feature:hover{transform:translateY(-4px);border-color:#7652b5}
.iconbox{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#8b5cf61c;border:1px solid #9b6bff44;color:#c19bff;margin-bottom:18px}
.iconbox svg{width:22px;height:22px}.feature h3{font-size:15px;margin:0 0 8px}.feature p{font-size:12px;color:#a9a3bd;line-height:1.7;margin:0}
.bottom{margin:0 0 65px;padding:30px;border-radius:22px;border:1px solid #44305f;background:radial-gradient(ellipse at 90% 20%,#57269c35,transparent 42%),linear-gradient(110deg,#171321,#10101a);display:flex;align-items:center;justify-content:space-between;gap:24px}
.bottom h2{font-size:26px}.bottom p{font-size:13px;color:#aaa3bd;line-height:1.7;max-width:510px;margin:10px 0 0}
footer{border-top:1px solid #ffffff10;padding:24px 0 30px;color:#77728c;font-size:11px;display:flex;justify-content:space-between;align-items:center;gap:16px}.footbrand{display:flex;align-items:center;gap:9px;color:#e9e4f6;font-size:13px;font-weight:750}
@media(max-width:800px){nav{display:none}.hero{grid-template-columns:1fr;padding:55px 0 42px;gap:18px;text-align:center}.hero-copy{display:flex;align-items:center;flex-direction:column}.lead{font-size:14px}.art{min-height:310px}.shield-wrap{width:230px}.bot-art{width:145%}.f1{left:4%;top:14%}.f2{right:1%;bottom:13%}.features{grid-template-columns:repeat(2,1fr)}.bottom{align-items:flex-start;flex-direction:column}}
@media(max-width:520px){.wrap{width:calc(100% - 30px)}header{height:68px}.brand{font-size:18px}.logo{width:33px;height:37px}.header-btn{padding:10px 12px;font-size:11px}.hero{padding:43px 0 35px}h1{font-size:42px;letter-spacing:-1.8px}.lead{font-size:13px}.art{min-height:265px}.shield-wrap{width:190px}.bot-art{width:145%}.float{padding:8px 10px;font-size:10px}.float small{font-size:9px}.f1{left:0;top:12%}.f2{right:0;bottom:12%}.section{padding:38px 0 48px}.features{grid-template-columns:1fr;gap:11px}.feature{display:grid;grid-template-columns:43px 1fr;column-gap:14px;padding:17px}.iconbox{grid-row:span 2;margin:0}.feature h3{align-self:end}.feature p{align-self:start}.bottom{padding:23px;margin-bottom:42px}.bottom h2{font-size:23px}footer{flex-direction:column;align-items:flex-start}}

.status-panel{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;margin:0 auto 42px;border:1px solid #2c2940;border-radius:16px;background:linear-gradient(110deg,#12121d,#171326)}
.status-left{display:flex;align-items:center;gap:13px}.status-dot{width:11px;height:11px;border-radius:50%;background:#55e6b1;box-shadow:0 0 15px #55e6b188;flex:none}
.status-title{font-size:14px;font-weight:750}.status-caption{font-size:11px;color:#9690aa;margin-top:4px}
.status-tag{padding:7px 11px;border-radius:99px;color:#74efc0;background:#55e6b114;border:1px solid #55e6b13a;font-size:11px;font-weight:750;white-space:nowrap}
.faq-list{max-width:800px;margin:0 auto;display:grid;gap:10px}
.faq-list details{background:#12121d;border:1px solid #29263d;border-radius:14px;padding:0 17px}
.faq-list summary{cursor:pointer;list-style:none;padding:17px 0;font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:15px}
.faq-list summary::-webkit-details-marker{display:none}.faq-list summary:after{content:"+";color:#b78aff;font-size:20px;line-height:14px}.faq-list details[open] summary:after{content:"−"}
.faq-list p{margin:0;padding:0 0 17px;color:#a9a3bd;font-size:12px;line-height:1.75}
@media(max-width:520px){.status-panel{padding:16px;align-items:flex-start}.status-title{font-size:12px}.status-caption{max-width:220px;line-height:1.5}.status-tag{font-size:10px;padding:6px 8px}}


/* ===== AUTH MODAL (design preview) ===== */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#05050bcc;backdrop-filter:blur(8px);animation:fade .18s ease}
.overlay[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal{position:relative;width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;padding:28px 26px 24px;border:1px solid #3a2f58;border-radius:22px;background:radial-gradient(ellipse at 90% 0%,#57269c30,transparent 45%),linear-gradient(160deg,#171522,#0f0f19);box-shadow:0 30px 80px #000a,0 0 0 1px #ffffff06 inset;animation:pop .22s ease}
.m-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid #ffffff14;background:#ffffff08;color:#c9c3dd;font-size:20px;line-height:1;cursor:pointer}.m-close:hover{background:#ffffff14}
.m-head{text-align:center;margin-bottom:18px}.m-shield{width:46px;height:46px;margin:0 auto 10px;color:#b78aff;filter:drop-shadow(0 0 14px #8b5cf688)}
.m-head h3{margin:0 0 6px;font-size:21px;letter-spacing:-.5px}.m-head p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.preview-note{display:flex;gap:8px;align-items:flex-start;margin:0 0 16px;padding:9px 11px;border-radius:11px;border:1px dashed #8b5cf655;background:#8b5cf610;color:#c7a9ff;font-size:10.5px;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:18px;border-radius:12px;background:#0b0b14;border:1px solid #29263d}
.tab{padding:9px;border:0;border-radius:9px;background:transparent;color:#9c96b3;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer}.tab.on{background:linear-gradient(115deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 6px 18px #7c3aed40}
.btn-discord{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:12px;border:0;background:#5865F2;color:#fff;font-weight:750;font-size:13px;font-family:inherit;cursor:pointer;transition:.2s}.btn-discord:hover{background:#6b77ff;transform:translateY(-1px)}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6f6a86;font-size:10.5px;font-weight:700;letter-spacing:.6px}.or:before,.or:after{content:"";height:1px;flex:1;background:#2a2740}
.field{margin-bottom:13px}.field label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:#cfc9e2;margin-bottom:6px}.field label a{color:#b78aff;font-weight:600;cursor:pointer}
.input{width:100%;padding:12px 13px;border-radius:11px;border:1px solid #2f2b45;background:#0c0c15;color:var(--text);font-size:16px;font-family:inherit;outline:0;transition:.15s}.input::placeholder{color:#625d79}.input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf630}
.pw{position:relative}.pw .input{padding-right:58px}.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 9px;border:0;border-radius:8px;background:#ffffff0c;color:#b9b3cd;font-weight:700;font-size:10.5px;font-family:inherit;cursor:pointer}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.meter i{height:4px;border-radius:4px;background:#2a2740;transition:.2s}.meter.s1 i:nth-child(-n+1){background:#ff6b81}.meter.s2 i:nth-child(-n+2){background:#ffb454}.meter.s3 i:nth-child(-n+3){background:#c8e65a}.meter.s4 i{background:#55e6b1}
.hint{font-size:10.5px;color:#7d7894;margin-top:6px}
.captcha{width:100%;display:flex;align-items:center;gap:12px;padding:11px 13px;margin:2px 0 13px;border-radius:11px;border:1px solid #2f2b45;background:#0c0c15;color:#d8d3ea;font-weight:600;font-size:12.5px;font-family:inherit;cursor:pointer;text-align:left}
.cap-box{width:22px;height:22px;border-radius:6px;border:2px solid #5d5878;display:grid;place-items:center;flex:none;transition:.2s}
.captcha.load .cap-box{border-color:#8b5cf6;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.captcha.ok .cap-box{background:#55e6b1;border-color:#55e6b1;color:#06281d}
@keyframes spin{to{transform:rotate(360deg)}}
.cap-txt{flex:1}.cap-by{font-size:9px;color:#7d7894;text-align:right;line-height:1.3;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:11.5px;color:#aaa4c0;line-height:1.55;margin:4px 0 14px}.check input{accent-color:#8b5cf6;margin-top:2px;width:16px;height:16px;flex:none}.check a{color:#b78aff;text-decoration:underline}
.err{display:none;margin:0 0 12px;padding:9px 11px;border-radius:10px;border:1px solid #ff6b8144;background:#ff6b8112;color:#ff9aa9;font-size:11.5px;line-height:1.5}.err.show{display:block}
.submit{width:100%;padding:13px;border:1px solid #bd8cff66;border-radius:12px;background:linear-gradient(115deg,#7c3aed,#a855f7);color:#fff;font-weight:750;font-size:13px;font-family:inherit;cursor:pointer;box-shadow:0 8px 26px #7c3aed38;transition:.2s}.submit:hover{transform:translateY(-1px);box-shadow:0 12px 32px #8b5cf655}
.m-foot{margin:16px 0 0;text-align:center;font-size:11.5px;color:#8f89a6}.m-foot a{color:#b78aff;font-weight:700;cursor:pointer}
.mail-ic{width:62px;height:62px;margin:2px auto 14px;border-radius:18px;display:grid;place-items:center;background:#8b5cf61c;border:1px solid #9b6bff44;color:#c19bff}
.confirm{text-align:center}.confirm h3{margin:0 0 8px;font-size:20px}.confirm p{margin:0 0 6px;font-size:12.5px;color:var(--muted);line-height:1.7}.confirm b{color:#e9e4f6}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:60;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;border:1px solid #6e4ca899;background:#151321f2;color:#e9e4f6;font-size:12px;font-weight:600;box-shadow:0 14px 40px #000a;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
.header-actions{display:flex;align-items:center;gap:10px}
@media(max-width:520px){.header-btn{display:none}.header-signin{padding:10px 14px;font-size:12px}.modal{padding:24px 18px 20px;border-radius:20px}}

/* ===== MENU + DASHBOARD (design preview) ===== */
.burger{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff08;display:grid;place-items:center;cursor:pointer}
.burger i,.burger i:before,.burger i:after{display:block;width:18px;height:2px;background:#fff;border-radius:2px;content:"";position:relative}
.burger i:before{position:absolute;top:-6px}.burger i:after{position:absolute;top:6px}
.dbg{position:fixed;inset:0;z-index:40;background:#05050bb0;backdrop-filter:blur(4px)}.dbg[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(290px,86%);padding:22px 16px;background:linear-gradient(170deg,#171522,#0d0d16);border-left:1px solid #3a2f58;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;gap:4px}.drawer.on{transform:none}
.drawer h4{margin:4px 12px 14px;font-size:11px;letter-spacing:1px;color:#7d7894}
.drawer a{padding:13px 14px;border-radius:12px;font-weight:700;font-size:14px;color:#d9d3ee;cursor:pointer}.drawer a:hover,.drawer a.on{background:#8b5cf61c;color:#fff}
.dash{padding:26px 0 60px}.dtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.dtop h2{margin:0;font-size:24px}
.dtop .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dtop select{width:auto;min-width:150px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border-radius:99px;font-size:11px;font-weight:750;color:#74efc0;background:#55e6b114;border:1px solid #55e6b13a}.pill.off{color:#ff9aa9;background:#ff6b8112;border-color:#ff6b8144}.pill.soon{color:#ffd37a;background:#ffb45414;border-color:#ffb45440}
.dlayout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
.dnav{display:flex;flex-direction:column;gap:3px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);position:sticky;top:14px}
.dnav button{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;border-radius:10px;background:transparent;color:#b5afca;font-family:inherit;font-size:13px;font-weight:650;cursor:pointer;text-align:left}.dnav button:hover{background:#ffffff08}.dnav button.on{background:linear-gradient(115deg,#7c3aed44,#a855f722);color:#fff;box-shadow:inset 0 0 0 1px #8b5cf655}
.ph{margin:0 0 14px}.ph h3{margin:0 0 4px;font-size:20px}.ph p{margin:0;font-size:12.5px;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#171522,#10101a);padding:20px;margin-bottom:14px}.card h3{margin:0 0 4px;font-size:15px;display:flex;gap:8px;align-items:center}.card .d{font-size:12px;color:var(--muted);margin:0 0 6px;line-height:1.6}
.sw{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-top:1px solid #ffffff0a;cursor:pointer;font-size:13px}.sw small{display:block;color:#8f89a6;font-size:11px;margin-top:3px;font-weight:500}
.sw input{display:none}.sw i{width:42px;height:24px;border-radius:99px;background:#2a2740;position:relative;flex:none;transition:.2s}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:linear-gradient(115deg,#7c3aed,#a855f7)}.sw input:checked+i:after{transform:translateX(18px)}
.f{margin:14px 0 0}.f label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#cfc9e2;margin-bottom:7px}.f em{color:#b78aff;font-style:normal}.hint{font-size:10.5px;color:#7d7894;margin-top:6px}
.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2f2b45;background:#0c0c15;color:var(--text);font-size:16px;font-family:inherit;outline:0}.in:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px #8b5cf630}.in.bad{border-color:#ff6b81}textarea.in{resize:vertical}
input[type=range]{width:100%;accent-color:#8b5cf6}.hex{display:flex;gap:10px}.hex input[type=color]{width:46px;height:44px;padding:2px;border:1px solid #2f2b45;border-radius:10px;background:#0c0c15;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:99px;border:1px solid #2f2b45;background:#0c0c15;color:#a9a3bd;font-size:12px;font-weight:650;cursor:pointer;font-family:inherit}.chip.on{background:#8b5cf622;border-color:#8b5cf6;color:#d9c7ff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.pv{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:4px solid #5865F2;background:#2b2d31;font-size:12px}.pv b{display:block;font-size:13px;margin-bottom:6px}.pv p{margin:0;color:#dbdee1;line-height:1.6;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#12121d}.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{font-size:11px;color:#8f89a6}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #ffffff0a;font-size:12.5px;color:#cfc9e2}.row small{color:#7d7894}
.btn.danger{background:linear-gradient(115deg,#dc2626,#f43f5e);border-color:#ff8a9a66;width:100%;margin-top:16px}
.mini{padding:6px 10px;border-radius:8px;border:1px solid #ffffff22;background:#ffffff08;color:#d9d3ee;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.savebar{position:sticky;bottom:14px;display:none;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #6e4ca8;border-radius:14px;background:#151321f2;backdrop-filter:blur(10px);box-shadow:0 14px 40px #000a;font-size:12.5px;font-weight:650}.savebar.on{display:flex}.savebar div{display:flex;gap:8px}.savebar .btn{padding:9px 16px}
@media(max-width:900px){.dlayout{grid-template-columns:1fr}.dnav{flex-direction:row;overflow-x:auto;position:sticky;top:0;z-index:5;padding:8px}.dnav button{white-space:nowrap;flex:none}.stats{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}

.qa{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.qa .mini{padding:9px 13px;font-size:12px}.qa .mini.on{background:#ff6b8118;border-color:#ff6b8155;color:#ff9aa9}
.sc{display:flex;align-items:center;gap:16px;margin:8px 0 4px}.sc b{font-size:34px;letter-spacing:-1px;min-width:84px}.sc div{flex:1}.bar{height:10px;border-radius:9px;background:#2a2740;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7c3aed,#55e6b1)}
.acts{display:flex;gap:6px;flex-wrap:wrap}.row.mem{flex-wrap:wrap}.tag{padding:3px 8px;border-radius:7px;background:#8b5cf61c;color:#c7a9ff;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.4px}

.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dnav .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#ffffff0a;color:#b78aff;transition:.2s}.dnav button:hover .ico{background:#8b5cf624}.dnav button.on .ico{background:linear-gradient(135deg,#7c3aed,#c084fc);color:#fff;box-shadow:0 0 16px #8b5cf688}
.ph h3{display:flex;align-items:center;gap:12px}.hico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#7c3aed,#c084fc);color:#fff;box-shadow:0 8px 22px #7c3aed55}.hico .ic{width:20px;height:20px}
.drawer a{display:flex;align-items:center;gap:12px}.drawer a .ic{color:#b78aff}.drawer a.on .ic{color:#fff}
.mini{display:inline-flex;gap:6px;align-items:center}.mini .ic{width:15px;height:15px}.btn.danger{display:flex;align-items:center;justify-content:center;gap:8px}.row .ic{color:#ffb454;width:16px;height:16px;vertical-align:-3px}
</style>
